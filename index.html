<!doctype html>
<html lang="en">

<head>
  <script>
    // React起動前のJavaScriptエラーを画面へ表示
    window.addEventListener("error", function (event) {
      var bootStatus =
        document.getElementById("boot-status");

      if (!bootStatus) {
        return;
      }

      // JS・CSSなどの読込み失敗
      if (event.target && event.target !== window) {
        var source =
          event.target.src ||
          event.target.href ||
          "unknown resource";

        bootStatus.textContent =
          "Resource Error: " + source;

        return;
      }

      // 通常のJavaScriptエラー
      bootStatus.textContent =
        "Boot Error: " +
        (event.message || "Unknown error");
    }, true);

    // 非同期処理で未処理のエラーを画面へ表示
    window.addEventListener(
      "unhandledrejection",
      function (event) {
        var bootStatus =
          document.getElementById(
            "boot-status"
          );

        if (!bootStatus) {
          return;
        }

        var reason = event.reason;

        bootStatus.textContent =
          "Promise Error: " +
          (
            reason &&
              reason.message
              ? reason.message
              : String(reason)
          );
      }
    );
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>serial-app</title>
</head>

<body>
  <!-- React起動前の状態・エラー表示 -->
  <div id="boot-status" style="
      padding: 16px;
      margin: 12px;
      border: 2px solid #d97706;
      border-radius: 8px;
      background: #fff7ed;
      color: #7c2d12;
      font-family: sans-serif;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    ">
    Application starting...
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

</html>
